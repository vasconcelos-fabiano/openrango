services:
  mysql:
    image: mysql:8.4
    container_name: openrango-mysql
    environment:
      MYSQL_DATABASE: openrango
      MYSQL_USER: openrango
      MYSQL_PASSWORD: openrango_dev
      MYSQL_ROOT_PASSWORD: openrango_root
    ports:
      - "3306:3306"
    volumes:
      - openrango_mysql_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: openrango-backend
    working_dir: /app
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - mysql

  frontend:
    build: .
    container_name: openrango-frontend
    working_dir: /app
    ports:
      - "4200:4200"
      - "4201:4201"
      - "4202:4202"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/institutional/node_modules
    command: npm run or

volumes:
  openrango_mysql_data:
