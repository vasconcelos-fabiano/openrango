services:
  backend:
    build: ./backend
    container_name: openrango-backend
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3307
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: .
    container_name: openrango-frontend
    working_dir: /app
    ports:
      - "4200:4200"
      - "4201:4201"
      - "4202:4202"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/institutional/node_modules
    command: npm run or

volumes:
  openrango_mysql_data:
