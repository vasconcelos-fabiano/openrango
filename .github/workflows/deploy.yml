name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular app
        working-directory: frontend
        run: npm run build -- --configuration production --base-href /dev/

      - name: Install institutional dependencies
        working-directory: institutional
        run: npm ci

      - name: Build institutional site
        working-directory: institutional
        run: npm run build -- --configuration production

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Hostinger host to known_hosts
        run: |
          mkdir -p /home/runner/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> /home/runner/.ssh/known_hosts

      - name: Deploy via rsync over SSH
        run: |
          # Deploy institutional site to /
          rsync -avz --delete --exclude='dev/' -e "ssh -p ${{ secrets.SSH_PORT }}" \
            institutional/dist/institutional/browser/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/u835982839/public_html/openrango/

          # Deploy ERP to /dev/
          rsync -avz --delete -e "ssh -p ${{ secrets.SSH_PORT }}" \
            frontend/dist/frontend/browser/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/u835982839/public_html/openrango/dev/