<h1>Pedidos</h1>
<div class="pedidos-container">
    <div class="pedidos-esquerda">
        <div class="acoes-pedido">
            <button class="btn-novo" type="button">Novo Pedido</button>
            <button class="btn-consolidar" type="button">Consolidar</button>
        </div>

        <div class="tipo-pedido">
            <label>
                <input type="radio" name="tipo-pedido" value="salao" (change)="selecionarTipo('salao')">
                Salão
            </label>

            <label>
                <input type="radio" name="tipo-pedido" value="delivery" checked (change)="selecionarTipo('delivery')">
                Delivery
            </label>
            @if (tipoSelecionado === 'salao') {
            <app-not-implemented></app-not-implemented>
            }
        </div>
    </div>

</div>
