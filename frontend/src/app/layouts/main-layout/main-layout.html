<div class="app-container">

    <aside class="sidebar" [class.sidebar-aberta]="sidebarAberta">

        <div class="sidebar-logo">
            <!-- Logo do OpenRango entra aqui -->
        </div>

        <div class="sidebar-header">
            <h2>OpenRango</h2>
            <span class="version">0.2</span>
            <span class="license">Licenciado para Madame Sibita</span>
        </div>
        <nav class="main-nav">
            <ul>
                <li class="nav-item">
                    <a routerLink="/app/pedidos" class="nav-link">Pedidos</a>
                </li>
                <li class="nav-item">
                    <a routerLink="/app/estoque" class="nav-link">Estoque</a>
                </li>
                <li class="nav-item">
                    <a routerLink="/app/clientes" class="nav-link">Clientes</a>
                </li>
                <li class="nav-item">
                    <a routerLink="/app/rotulos" class="nav-link">Rótulos</a>
                </li>
                <li class="nav-item">
                    <a routerLink="/app/produtos" class="nav-link">Produtos</a>
                </li>
                <li class="nav-item">
                    <a routerLink="/app/precificacao" class="nav-link">Precificação</a>
                </li>
                <li class="nav-item">
                    <a routerLink="/app/producao" class="nav-link">Produção</a>
                </li>
                <li class="nav-item">
                    <a routerLink="/app/afiliados" class="nav-link">Afiliados</a>
                </li>
                <li class="nav-item">
                    <a routerLink="/app/marketing" class="nav-link">Marketing</a>
                </li>
                <li class="nav-item">
                    <a routerLink="/app/relatorios" class="nav-link">Estatísticas e Relatórios</a>
                </li>
            </ul>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-footer">
                <p class="sidebar-date">Seg, 30/09/2026 19:30</p>
                <p>Logado como:</p>
                <p>Fabiano Vasconcelos [001]</p>
                <button class="logout-button" type="button">
                    <svg class="logout-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M10 17l5-5-5-5M15 12H3M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5" />
                    </svg>
                    Sair
                </button>
            </div>
        </div>
    </aside>
    <button class="sidebar-handle" (click)="alternarSidebar()">
        {{ sidebarAberta ? '‹' : '›' }}
    </button>
    <main class="main-content">
        <router-outlet></router-outlet>
    </main>

</div>
